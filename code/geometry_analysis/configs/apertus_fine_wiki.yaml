model:
  name: "swiss-ai/Apertus-8B-2509"
  checkpoints: "all"
  branch_filter_pattern: "^step\\d+-tokens\\d+[BT]$"
  max_checkpoints: null
  checkpoint_step: null
  trust_remote_code: true
  torch_dtype: "bfloat16"

datasets:
  - name: "English"
    path: "HuggingFaceFW/finewiki"
    subset: "en"
  - name: "Chinese"
    path: "HuggingFaceFW/finewiki"
    subset: "zh"
  - name: "French"
    path: "HuggingFaceFW/finewiki"
    subset: "fr"
  - name: "Indonesian"
    path: "HuggingFaceFW/finewiki"
    subset: "id"
  - name: "Italian"
    path: "HuggingFaceFW/finewiki"
    subset: "it"
  - name: "Swahili"
    path: "HuggingFaceFW/finewiki"
    subset: "sw"
  - name: "Spanish"
    path: "HuggingFaceFW/finewiki"
    subset: "es"
  - name: "German"
    path: "HuggingFaceFW/finewiki"
    subset: "de"
  - name: "Hindi"
    path: "HuggingFaceFW/finewiki"
    subset: "hi"
  - name: "Arabic"
    path: "HuggingFaceFW/finewiki"
    subset: "ar"
  - name: "Turkish"
    path: "HuggingFaceFW/finewiki"
    subset: "tr"
  - name: "Vietnamese"
    path: "HuggingFaceFW/finewiki"
    subset: "vi"
  - name: "Japanese"
    path: "HuggingFaceFW/finewiki"
    subset: "ja"
  - name: "Finnish"
    path: "HuggingFaceFW/finewiki"
    subset: "fi"

collection:
  layers: "all"
  aggregations: ["last", "mean"]
  num_sequences: 10000
  max_sequence_length: 256
  min_sequence_length: 32
  batch_size: 32
  seed: 42
  streaming: false

output:
  results_path: "results/apertus_fine_wiki.csv"
  samples_dir: "/mnt/course-cs-552/rcp-caas-cs-552-g33/scratch-g33/selected_samples"