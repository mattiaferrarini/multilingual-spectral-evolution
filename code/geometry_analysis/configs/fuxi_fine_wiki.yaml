model:
  name: "TJUNLP/FuxiTranyu-8B"
  checkpoints: "all"        # "all" = auto-discover branches, null = default branch, or a list: ["10B", "50B"]
  max_checkpoints: null       # cap the number of checkpoints processed (null = no limit)
  checkpoint_step: null     # keep every Nth checkpoint (e.g. 3 = indices 0, 3, 6, …; null = all)
  trust_remote_code: true
  torch_dtype: "bfloat16"
  # attn_implementation: "flash_attention_2"  # uncomment if flash-attn is installed

datasets:
  - name: "English"
    path: "HuggingFaceFW/finewiki"
    subset: "en"
  - name: "Chinese"
    path: "HuggingFaceFW/finewiki"
    subset: "zh"
  - name: "French"
    path: "HuggingFaceFW/finewiki"
    subset: "fr"
  - name: "Indonesian"
    path: "HuggingFaceFW/finewiki"
    subset: "id"
  - name: "Italian"
    path: "HuggingFaceFW/finewiki"
    subset: "it"
  - name: "Swahili"
    path: "HuggingFaceFW/finewiki"
    subset: "sw"
  - name: "Spanish"
    path: "HuggingFaceFW/finewiki"
    subset: "es"
  - name: "German"
    path: "HuggingFaceFW/finewiki"
    subset: "de"
  - name: "Hindi"
    path: "HuggingFaceFW/finewiki"
    subset: "hi"
  - name: "Arabic"
    path: "HuggingFaceFW/finewiki"
    subset: "ar"
  - name: "Turkish"
    path: "HuggingFaceFW/finewiki"
    subset: "tr"
  - name: "Vietnamese"
    path: "HuggingFaceFW/finewiki"
    subset: "vi"
  - name: "Japanese"
    path: "HuggingFaceFW/finewiki"
    subset: "ja"
  - name: "Finnish"
    path: "HuggingFaceFW/finewiki"
    subset: "fi"

collection:
  layers: "all"        # "last", "all", list of ints, or {start, end, step}
  aggregations: ["last", "mean"]   # "last", "first", or "mean"
  num_sequences: 10000
  max_sequence_length: 256
  min_sequence_length: 32
  batch_size: 32
  seed: 42                 # controls dataset sampling; same seed = same sequences across all checkpoints
  streaming: false         # false = download full subset then shuffle globally (proper uniform sampling)
                           # true  = streaming with buffer-based shuffle (faster but biased toward dataset start)

output:
  results_path: "code/results/fuxi_fine_wiki.csv"
  samples_dir: "data/selected_samples"
