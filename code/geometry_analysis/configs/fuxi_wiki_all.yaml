debug: false

model:
  name: "TJUNLP/FuxiTranyu-8B"
  checkpoints: "all" 
  max_checkpoints: null       # cap the number of checkpoints processed (null = no limit)
  checkpoint_step: null     # keep every Nth checkpoint (e.g. 3 = indices 0, 3, 6, …; null = all)
  trust_remote_code: true
  torch_dtype: "bfloat16"
  # attn_implementation: "flash_attention_2"  # uncomment if flash-attn is installed

# Wikipedia probe — same-domain (encyclopedic) text across all languages.
# Compare results against fuxi_test.csv (FineWeb2) to isolate how much of the
# per-language RankMe difference is due to text style/quality vs the language itself.
datasets:
  - name: "English"
    path: "wikimedia/wikipedia"
    subset: "20231101.en"
    split: "train"
  - name: "Chinese"
    path: "wikimedia/wikipedia"
    subset: "20231101.zh"
    split: "train"
  - name: "French"
    path: "wikimedia/wikipedia"
    subset: "20231101.fr"
    split: "train"
  - name: "Indonesian"
    path: "wikimedia/wikipedia"
    subset: "20231101.id"
    split: "train"
  - name: "Italian"
    path: "wikimedia/wikipedia"
    subset: "20231101.it"
    split: "train"
  - name: "Swahili"
    path: "wikimedia/wikipedia"
    subset: "20231101.sw"
    split: "train"
  - name: "Spanish"
    path: "wikimedia/wikipedia"
    subset: "20231101.es"
    split: "train"
  - name: "German"
    path: "wikimedia/wikipedia"
    subset: "20231101.de"
    split: "train"
  - name: "Hindi"
    path: "wikimedia/wikipedia"
    subset: "20231101.hi"
    split: "train"
  - name: "Arabic"
    path: "wikimedia/wikipedia"
    subset: "20231101.ar"
    split: "train"
  - name: "Turkish"
    path: "wikimedia/wikipedia"
    subset: "20231101.tr"
    split: "train"
  - name: "Vietnamese"
    path: "wikimedia/wikipedia"
    subset: "20231101.vi"
    split: "train"
  - name: "Japanese"
    path: "wikimedia/wikipedia"
    subset: "20231101.ja"
    split: "train"

collection:
  layers: "all"
  aggregations: ["last", "mean"]
  num_sequences: 10000
  max_sequence_length: 256
  min_sequence_length: 32
  batch_size: 32
  seed: 42

output:
  results_path: "code/results/fuxi_wiki_all.csv"
  samples_dir: "data/selected_samples_wiki"
