model:
  name: swiss-ai/Apertus-8B-2509
  checkpoints: all           # null = default branch, "all" = auto-discover, or list of branch names
  max_checkpoints: null       # cap the number of checkpoints processed (null = no limit)
  checkpoint_step: 3       # keep every Nth checkpoint (e.g. 3 = indices 0, 3, 6, …; null = all)
  # branch_filter_pattern: null # regex to filter branches (null = no filter)
  branch_filter_pattern: "^step\\d+-tokens\\d+[BT]$"
  trust_remote_code: true

output_dir: code/results/xnli

icl:
  k: [4, 8, 16]        # number of in-context examples — int or list of ints (0 = zero-shot)
  n_eval: 1000                # number of evaluation examples (in target language)
  context_split: validation  # split used for ICL shots (human-translated, avoids test contamination)
  eval_split: test           # split used for evaluation
  balanced_labels: true      # sample equal entailment/neutral/contradiction in context

generation:
  temperature: 0.0    # greedy decoding
  max_tokens: 16
  seed: 42
  hf_batch_size: 8   # only used when vLLM is unavailable; reduce if OOM

# Languages from fuxi_fine_wiki.yaml that are also available in XNLI.
# Excluded (not in XNLI): fi (Finnish), id (Indonesian), it (Italian), ja (Japanese).
languages:
  ar: Arabic
  de: German
  en: English
  es: Spanish
  fr: French
  hi: Hindi
  sw: Swahili
  tr: Turkish
  vi: Vietnamese
  zh: Chinese

plotting:
  output_dir: plots/xnli/accuracy_heatmaps/Apertus-8B-2509

geometry:
  csv: code/results/apertus_fine_wiki.csv
  layer: layer_31
