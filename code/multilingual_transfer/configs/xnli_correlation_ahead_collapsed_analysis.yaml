geometry:
  aggregation: last
  layer_collapse: [average_rankme, average_predictors]  # collapse strategies to run
  layers:
    start: 0.0   # relative: 0.0 = first layer, 1.0 = last layer
    end: 1.0
    step: 1      # absolute integer stride (1 = every layer, 2 = every other, …)

correlation:
  t_values: [1, 5, 10]   # timesteps ahead: geometry at C predicts performance at C+T
  n_perm: 1000
  pairs_csv:      "code/results/xnli_correlations_ahead_collapsed/{model}/pairs.csv"
  results_csv:    "code/results/xnli_correlations_ahead_collapsed/{model}/correlation_results.csv"
  lag_dir:        "plots/xnli_correlations_ahead_collapsed/{model}/lag_summary"
  timeseries_dir: "plots/xnli_correlations_ahead_collapsed/{model}/timeseries"
  bar_dir:        "plots/xnli_correlations_ahead_collapsed/{model}/bar_summary"

# Optional filters — omit a key (or comment it out) to keep all values.
filter:
  # predictors: [signed_diff, norm_asym]
  # k_values: [8]
  # normalizations: [row_norm]
  correlations: [spearman, pearson]
