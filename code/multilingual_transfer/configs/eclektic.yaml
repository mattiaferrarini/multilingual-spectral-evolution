models:
  - swiss-ai/Apertus-8B-Instruct-2509
  - TJUNLP/FuxiTranyu-8B-DPO

data_path: multilingual_transfer/datasets/eclektic_main.jsonl

# Number of unique questions to evaluate (each appears in N languages). Omit or set to null for all.
max_questions: null

eval_models:
  - Qwen/Qwen3.5-27B
  - zai-org/GLM-4.7-Flash

output_dir: code/results/eclektic

judge_concurrency: 50
judge_checkpoint_every: 100

# Evaluation methods to run (any combination of: llm, string)
eval_method:
  - llm
  - string

generation:
  temperature: 0.7
  n_generations: 1  # set > 1 to estimate std across independent samples
  max_tokens: 512
  seed: 42
  hf_batch_size: 8  # only used when vLLM is unavailable; reduce if OOM

languages:
  de: German
  en: English
  es: Spanish
  fr: French
  hi: Hindi
  id: Indonesian
  it: Italian
  ja: Japanese
  zh: Chinese
