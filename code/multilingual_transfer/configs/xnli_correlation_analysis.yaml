geometry:
  aggregation: last
  layers:
    start: 0.0   # relative: 0.0 = first layer, 1.0 = last layer
    end: 1.0
    step: 1      # absolute integer stride (1 = every layer, 2 = every other, …)

correlation:
  n_perm: 1000
  pairs_csv: "code/results/xnli_correlations/{model}/pairs.csv"
  results_csv: "code/results/xnli_correlations/{model}/correlation_results.csv"
  timeseries_dir: "plots/xnli_correlations/{model}/timeseries"
  heatmaps_dir: "plots/xnli_correlations/{model}/heatmaps"

# Optional filters — omit a key (or comment it out) to keep all values.
filter:
  # predictors: [signed_diff, norm_asym]
  # k_values: [4, ]
  # normalizations: [row_norm]
  correlations: [spearman, pearson]
