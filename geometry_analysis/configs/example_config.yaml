# This is an example configuration file demonstrating all available fields 
# and how to use them to customize the activation collection and metric computation.

# Enable debug mode to print more verbose logging during execution
debug: false

model:
  # The Hugging Face model repository ID
  name: "swiss-ai/Apertus-8B-2509"
  
  # Checkpoints to process:
  # - "all": Automatically discover all branches in the repository
  # - null: Just use the default branch (usually 'main')
  # - ["branch1", "branch2"]: Specific list of branches/tags to process
  checkpoints: "all"
  
  # Regex pattern to filter discovered branches (only used if checkpoints: "all")
  branch_filter_pattern: "^step\\d+-tokens\\d+[BT]$"
  
  # Cap the maximum number of checkpoints processed (null = no limit)
  max_checkpoints: 60
  
  # Step size for picking checkpoints (e.g., 3 means keep every 3rd checkpoint)
  checkpoint_step: 3
  
  # Allow remote code execution for custom model architectures
  trust_remote_code: true
  
  # Precision for loading the model weights
  torch_dtype: "bfloat16"
  
  # Optional: Attention implementation to use (e.g., "flash_attention_2" or "sdpa")
  # attn_implementation: "flash_attention_2"

datasets:
  # List of datasets to evaluate on. 
  # Each dataset needs a display 'name', Hugging Face 'path', and 'subset'.
  - name: "English"
    path: "HuggingFaceFW/fineweb"
    subset: "sample-10BT"
  - name: "French"
    path: "HuggingFaceFW/fineweb-2"
    subset: "fra_Latn"

collection:
  # Which layers to collect activations from.
  # Options:
  # 1. "all" (or ["all"]): Every single layer.
  # 2. A list: Specific layer indices, e.g., [0, 10, 20, "last"]
  # 3. A dictionary range: { start: 0, end: 32, step: 4 }
  layers: 
    start: 0
    end: 32
    step: 4
    
  # How to aggregate the token representations into a sequence-level vector.
  # Can be a single string or a list: ["last", "mean", "first"]
  aggregations: ["last", "mean"]
  
  # Total number of sequences to sample from each dataset
  num_sequences: 8000
  
  # Maximum and minimum sequence length for tokenization filtering
  max_sequence_length: 256
  min_sequence_length: 128
  
  # Batch size for model inference.
  batch_size: 32
  
  # Random seed for dataset sampling to ensure reproducibility across checkpoints
  seed: 42

output:
  # Where to save the final computed metrics CSV
  results_path: "results/metrics_example.csv"
  
  # Directory to cache the prepared dataset samples (speeds up multi-checkpoint runs)
  samples_dir: "results/samples"
