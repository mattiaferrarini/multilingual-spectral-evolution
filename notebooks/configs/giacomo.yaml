# Configuration for M-MMLU correlation analysis with RankMe scores.
# This file controls everything: which models, languages, evaluation params,
# and which RankMe scores (checkpoint / layer / aggregation) to correlate against.

models:
  - name: "Apertus"
    hf_id: "swiss-ai/Apertus-8B-2509"
    revision: "main"
    rankme_path: "/scratch/results/apertus.csv"
    trust_remote_code: true
    torch_dtype: "bfloat16"

  - name: "FuxiTranyu-8B"
    hf_id: "TJUNLP/FuxiTranyu-8B"
    revision: "main"
    rankme_path: "/scratch/results/fuxi.csv"
    trust_remote_code: true
    torch_dtype: "bfloat16"

evaluation:
  num_fewshot: 5          # few-shot examples prepended to each question
  batch_size: 4           # reduce to 1-2 if GPU OOM
  device: "cuda"          # "cuda", "cpu", or "mps"
  limit: 100             # set e.g. to 100 for a quick smoke-test run

  # Subsets of openai/MMMLU — run the discovery cell (gc-07) to see all available names.
  languages:
    - name: "French"
      mmmlu_subset: "FR_FR"
    - name: "Chinese"
      mmmlu_subset: "ZH_CN"
    - name: "German"
      mmmlu_subset: "DE_DE"
    - name: "Spanish"
      mmmlu_subset: "ES_LA"
    - name: "Italian"
      mmmlu_subset: "IT_IT"
    - name: "Indonesian"
      mmmlu_subset: "ID_ID"
    - name: "Arabic"
      mmmlu_subset: "AR_XY"
    - name: "Japanese"
      mmmlu_subset: "JA_JP"
    - name: "Hindi"
      mmmlu_subset: "HI_IN"
    - name: "Swahili"
      mmmlu_subset: "SW_KE"

rankme:
  # Primary RankMe configuration used for the main correlation.
  checkpoint: "main"       # "main" = final checkpoint; "auto" = last entry in CSV
  layer: "layer_27"        # last layer for 28-layer 8B models (0-indexed)
  aggregation: "mean"      # "mean" pools all token positions; "last" uses the last token

output:
  results_dir: "results/mmmlu"      # M-MMLU JSON results cached here
  figures_dir: "results/figures"    # plots saved here
